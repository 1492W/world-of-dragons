<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World of Dragons — อาณาจักรมังกร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;600;700&family=Mali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#161229; --night2:#241d44; --night3:#2f2658;
  --parch:#f7ecd4; --card:#fffaf0;
  --ember:#e8602c; --ember-d:#c14515;
  --gold:#f0b32a; --gold-d:#b97f12;
  --jade:#2fa37a; --jade-d:#1d7a58;
  --plum:#7a47b0; --sky:#3a86c8; --ink:#2b2118;
  --muted:#a99; --line:#3a3060;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Sarabun',sans-serif;color:#f2ead8;
  background:
    radial-gradient(1100px 600px at 50% -8%, #3a2d6b 0%, transparent 55%),
    radial-gradient(700px 500px at 90% 20%, #4a2d5e 0%, transparent 50%),
    linear-gradient(180deg, var(--night2) 0%, var(--night) 100%);
  background-attachment:fixed;min-height:100vh;
}
/* drifting stars */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(2px 2px at 12% 18%, #fff6 40%, transparent),
    radial-gradient(2px 2px at 72% 12%, #fff5 40%, transparent),
    radial-gradient(1.5px 1.5px at 38% 30%, #ffd98a88 40%, transparent),
    radial-gradient(2px 2px at 88% 42%, #fff4 40%, transparent),
    radial-gradient(1.5px 1.5px at 22% 52%, #fff4 40%, transparent),
    radial-gradient(2px 2px at 60% 60%, #ffd98a66 40%, transparent);
}
#app{max-width:560px;margin:0 auto;padding:20px 16px 40px;position:relative;z-index:1;}

/* ---------- hero ---------- */
.hero{text-align:center;padding:14px 0 8px;}
.hero .crown{font-size:80px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));animation:hover 3.6s ease-in-out infinite;}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
.hero h1{font-family:'Mitr';font-weight:700;font-size:clamp(30px,8vw,40px);margin:8px 0 0;
  background:linear-gradient(135deg,#ffe9a8,#f0b32a 55%,#e8602c);-webkit-background-clip:text;background-clip:text;color:transparent;
  letter-spacing:.5px;}
.hero .th{font-family:'Mali';font-weight:600;font-size:18px;color:#ffd98a;margin-top:-2px;}
.hero .tag{color:#cbb8e8;font-size:14px;margin-top:8px;}

/* ---------- royal banner ---------- */
.royal{margin:20px 0;border-radius:22px;padding:20px 18px;text-align:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#3a2d6b,#2a2052);border:1.5px solid #5a4a9a;box-shadow:0 10px 30px rgba(0,0,0,.35);}
.royal::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, #f0b32a22, transparent 60%);}
.royal .king{font-size:62px;line-height:1;filter:grayscale(1) brightness(.5);transition:.5s;position:relative;}
.royal.unlocked .king{filter:none;animation:hover 3s ease-in-out infinite;}
.royal .kname{font-family:'Mitr';font-weight:700;font-size:20px;margin:6px 0 2px;color:#ffe9a8;position:relative;}
.royal .kdesc{font-size:13px;color:#cbb8e8;margin-bottom:12px;position:relative;}
.pbar{height:14px;border-radius:10px;background:#1d1838;overflow:hidden;position:relative;border:1px solid #4a3f7a;}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ember));border-radius:10px;transition:width .8s cubic-bezier(.4,1.3,.5,1);}
.pcount{font-family:'Mitr';font-weight:600;font-size:13px;color:#ffd98a;margin-top:7px;position:relative;}

/* ---------- tribe cards ---------- */
.sec-label{font-family:'Mitr';font-weight:600;font-size:13px;color:#9a86c8;letter-spacing:2px;text-transform:uppercase;
  margin:24px 4px 10px;display:flex;align-items:center;gap:8px;}
.sec-label::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#4a3f7a,transparent);}
.tribe{border-radius:20px;padding:16px;margin-bottom:14px;background:var(--card);position:relative;overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.28);color:var(--ink);}
.tribe.locked{opacity:.62;}
.tribe .thead{display:flex;align-items:center;gap:11px;margin-bottom:13px;}
.tribe .temoji{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.15);}
.tribe .tinfo{flex:1;min-width:0;}
.tribe .tname{font-family:'Mitr';font-weight:700;font-size:18px;line-height:1.1;}
.tribe .tsub{font-size:12.5px;color:#8a7355;}
.tribe .tcount{font-family:'Mitr';font-weight:700;font-size:15px;padding:4px 11px;border-radius:20px;color:#fff;flex-shrink:0;}
.dragrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px;}
.dtok{width:52px;text-align:center;flex-shrink:0;}
.dtok .dc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;
  background:#efe2c4;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);position:relative;}
.dtok.have .dc{background:radial-gradient(circle at 50% 35%, #fff7e0, #f7e6bd);box-shadow:0 3px 10px rgba(240,179,42,.5);}
.dtok.lock .dc{filter:grayscale(1);}
.dtok.lock .dc span{filter:brightness(.35) opacity(.55);}
.dtok .dl{font-size:10px;color:#8a7355;margin-top:3px;line-height:1.1;height:22px;overflow:hidden;}
.dtok.have .dl{color:#6b5226;font-weight:600;}
.dtok .legend-ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold);animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.playbtn{display:block;width:100%;text-align:center;font-family:'Mitr';font-weight:600;font-size:16px;color:#fff;
  border:none;border-radius:13px;padding:12px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .07s;}
.playbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
.playbtn.soon{background:#cfc1a8!important;box-shadow:0 4px 0 #b3a488;cursor:default;color:#7a6c52;}

/* tribe accent colors */
.t-thai .temoji{background:linear-gradient(135deg,#5fc79a,#2fa37a);} .t-thai .tcount{background:var(--jade);} .t-thai .playbtn{background:var(--jade);box-shadow:0 4px 0 var(--jade-d);}
.t-math .temoji{background:linear-gradient(135deg,#f3884f,#e8602c);} .t-math .tcount{background:var(--ember);} .t-math .playbtn{background:var(--ember);box-shadow:0 4px 0 var(--ember-d);}
.t-spell .temoji{background:linear-gradient(135deg,#5ba3d8,#3a86c8);} .t-spell .tcount{background:var(--sky);} .t-spell .playbtn{background:var(--sky);box-shadow:0 4px 0 #275f8f;}
.t-sci .temoji{background:linear-gradient(135deg,#9a6cc8,#7a47b0);} .t-sci .tcount{background:var(--plum);}

/* ---------- demo toggle + footer ---------- */
.demobar{position:fixed;top:10px;right:10px;z-index:5;}
.demobtn{font-family:'Mitr';font-weight:600;font-size:12px;background:rgba(255,255,255,.12);color:#ffd98a;
  border:1px solid #5a4a9a;border-radius:20px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(4px);}
.demobtn.on{background:var(--gold);color:#3a2a08;border-color:var(--gold);}
footer{text-align:center;color:#8a7caa;font-size:12px;margin-top:24px;line-height:1.7;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000a;color:#fff;font-family:'Mitr';
  font-size:13px;padding:10px 18px;border-radius:22px;opacity:0;transition:.3s;z-index:9;backdrop-filter:blur(4px);}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="demobar"><button class="demobtn" id="demoBtn" onclick="toggleDemo()">🔮 ดูตัวอย่างสะสมครบ</button></div>
<div id="app">

  <div class="hero">
    <div class="crown">🐉</div>
    <h1>World of Dragons</h1>
    <div class="th">อาณาจักรมังกร</div>
    <div class="tag">เล่นครบทุกเกม สะสมมังกรครบทุกเผ่า ปลุกพญามังกรในตำนาน</div>
  </div>

  <div class="royal" id="royal">
    <div class="king" id="kingEmoji">👑</div>
    <div class="kname" id="kingName">พญามังกรห้าเผ่า</div>
    <div class="kdesc" id="kingDesc">สะสมพญามังกรให้ครบทุกเผ่าเพื่อปลุกราชาแห่งอาณาจักร</div>
    <div class="pbar"><i id="pbarFill" style="width:0%"></i></div>
    <div class="pcount" id="pcount">มังกรในตำนาน 0 / 3 เผ่า</div>
  </div>

  <div class="sec-label">เผ่ามังกร · Dragon Tribes</div>
  <div id="tribes"></div>

  <footer>
    1492W · World of Dragons<br>
    เล่นเกมไหนก็ได้มังกรเข้าคลังกลางใบเดียวกัน
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ WORLD OF DRAGONS — hub ============
   คลังมังกรกลาง: เก็บใน localStorage key เดียว ('worldofdragons_v1')
   ที่ทุกเกมใต้ 1492w.github.io แชร์ร่วมกันได้ (localStorage ผูกกับโดเมน ไม่ใช่ path)
   แต่ละเกมเมื่อถึง milestone จะ push id มังกรเผ่าของตัวเองลง tribes[ชื่อเผ่า] */

const TRIBES = [
  {
    id:'thai', cls:'t-thai', emoji:'📖', name:'เผ่าอ่านไทย', sub:'Dragon Thai · อ่านสะกดคำไทย',
    url:'https://1492w.github.io/dragon-thai/',
    dragons:[
      {id:'thai_consonant', e:'🐲', label:'มังกรพยัญชนะ', how:'ผ่านระดับ A'},
      {id:'thai_vowel',     e:'🐉', label:'มังกรสระ',      how:'ผ่านระดับ B'},
      {id:'thai_lead',      e:'🐊', label:'มังกรอักษรนำ',  how:'ผ่านระดับ C'},
      {id:'thai_tone',      e:'🎶', label:'มังกรวรรณยุกต์',how:'ผ่านระดับ D'},
      {id:'thai_collector', e:'💎', label:'มังกรนักสะสม',  how:'สะสมในเกมครึ่งหนึ่ง'},
      {id:'thai_king',      e:'👑', label:'พญามังกรไทย',   how:'พิชิตหอคอยทั้งหมด', legend:true},
    ],
  },
  {
    id:'math', cls:'t-math', emoji:'🔢', name:'เผ่าเลข', sub:'Math Dragon · คณิตคิดเร็ว',
    url:'https://1492w.github.io/math-dragon/',
    dragons:[
      {id:'math_add',  e:'🐲', label:'มังกรบวก',   how:'ผ่านด่านบวก'},
      {id:'math_sub',  e:'🐉', label:'มังกรลบ',    how:'ผ่านด่านลบ'},
      {id:'math_mul',  e:'🔥', label:'มังกรคูณ',   how:'ผ่านด่านคูณ'},
      {id:'math_div',  e:'🐊', label:'มังกรหาร',   how:'ผ่านด่านหาร'},
      {id:'math_speed',e:'💎', label:'มังกรคิดเร็ว',how:'ทำเวลาได้ตามเป้า'},
      {id:'math_king', e:'👑', label:'พญามังกรเลข',how:'พิชิตทุกด่าน', legend:true},
    ],
  },
  {
    id:'spelling', cls:'t-spell', emoji:'🔤', name:'เผ่าอักษร', sub:'Dragon Spelling · สะกดอังกฤษ',
    url:'https://1492w.github.io/dragon-spelling/',
    dragons:[
      {id:'sp_abc',    e:'🐲', label:'มังกร ABC',  how:'รู้จักตัวอักษร'},
      {id:'sp_short',  e:'🐉', label:'มังกรคำสั้น', how:'สะกดคำสั้นได้'},
      {id:'sp_long',   e:'🐊', label:'มังกรคำยาว', how:'สะกดคำยาวได้'},
      {id:'sp_sight',  e:'⚡', label:'มังกรคำที่พบบ่อย', how:'จำ sight words'},
      {id:'sp_master', e:'💎', label:'มังกรนักสะกด',how:'สะสมในเกมครึ่งหนึ่ง'},
      {id:'sp_king',   e:'👑', label:'พญามังกรอักษร',how:'พิชิตหอคำศัพท์', legend:true},
    ],
  },
  {
    id:'science', cls:'t-sci', emoji:'🔬', name:'เผ่าวิทย์', sub:'เร็ว ๆ นี้',
    url:null, soon:true,
    dragons:[
      {id:'sci_1', e:'🧪', label:'', how:''},{id:'sci_2', e:'🔭', label:'', how:''},
      {id:'sci_3', e:'🪐', label:'', how:''},{id:'sci_4', e:'⚗️', label:'', how:''},
      {id:'sci_5', e:'💎', label:'', how:''},{id:'sci_6', e:'👑', label:'', how:'', legend:true},
    ],
  },
];

const KEY='worldofdragons_v1';
let demo=false;

function loadWorld(){
  if(demo){ // ตัวอย่าง: ปลดมังกรเกือบครบทุกเผ่าที่เปิดอยู่ ให้เห็นภาพปลายทาง
    return {tribes:{
      thai:['thai_consonant','thai_vowel','thai_lead','thai_tone','thai_collector','thai_king'],
      math:['math_add','math_sub','math_mul','math_div','math_speed','math_king'],
      spelling:['sp_abc','sp_short','sp_long','sp_sight','sp_master','sp_king'],
    }};
  }
  try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return {tribes:{}};
}

function render(){
  const W=loadWorld(); const got=(W.tribes)||{};
  const host=document.getElementById('tribes'); host.innerHTML='';
  let kingsGot=0, kingsTotal=0;

  TRIBES.forEach(T=>{
    const owned = new Set(got[T.id]||[]);
    const have = T.dragons.filter(d=>owned.has(d.id)).length;
    const total = T.dragons.length;
    if(!T.soon){ kingsTotal++; if(owned.has(T.id+'_king')||owned.has(T.dragons[T.dragons.length-1].id))kingsGot++; }

    const card=document.createElement('div');
    card.className='tribe '+T.cls+(T.soon?' locked':'');
    let toks='';
    T.dragons.forEach(d=>{
      const has=owned.has(d.id);
      toks+=`<div class="dtok ${has?'have':'lock'}">
        <div class="dc">${has&&d.legend?'<div class="legend-ring"></div>':''}<span>${d.e}</span></div>
        <div class="dl">${T.soon?'':(d.label||'')}</div>
      </div>`;
    });
    card.innerHTML=`
      <div class="thead">
        <div class="temoji">${T.emoji}</div>
        <div class="tinfo"><div class="tname">${T.name}</div><div class="tsub">${T.sub}</div></div>
        <div class="tcount">${T.soon?'🔒':have+'/'+total}</div>
      </div>
      <div class="dragrow">${toks}</div>
      ${T.soon
        ? `<button class="playbtn soon">เร็ว ๆ นี้</button>`
        : `<button class="playbtn" onclick="goGame('${T.url}')">เล่นเลย →</button>`}
    `;
    host.appendChild(card);
  });

  // royal
  const royal=document.getElementById('royal');
  const pct = kingsTotal? Math.round(kingsGot/kingsTotal*100):0;
  document.getElementById('pbarFill').style.width=pct+'%';
  document.getElementById('pcount').textContent=`พญามังกร ${kingsGot} / ${kingsTotal} เผ่า`;
  if(kingsGot>=kingsTotal && kingsTotal>0){
    royal.classList.add('unlocked');
    document.getElementById('kingEmoji').textContent='✨';
    document.getElementById('kingName').textContent='จักรพรรดิมังกร';
    document.getElementById('kingDesc').textContent='ปลุกราชาแห่งอาณาจักรสำเร็จ! พอดีคือเจ้าแห่งมังกรตัวจริง';
  }else{
    royal.classList.remove('unlocked');
    document.getElementById('kingEmoji').textContent='👑';
    document.getElementById('kingName').textContent='พญามังกรห้าเผ่า';
    document.getElementById('kingDesc').textContent='สะสมพญามังกร (👑) ให้ครบทุกเผ่าเพื่อปลุกราชาแห่งอาณาจักร';
  }
}

function goGame(url){ if(url) location.href=url; }
function toggleDemo(){
  demo=!demo;
  document.getElementById('demoBtn').classList.toggle('on',demo);
  document.getElementById('demoBtn').textContent = demo?'🔮 กำลังดูตัวอย่าง':'🔮 ดูตัวอย่างสะสมครบ';
  toast(demo?'นี่คือภาพเมื่อสะสมครบทุกเผ่า':'กลับมาที่ข้อมูลจริง');
  render();
}
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000);}

render();
</script>
</body>
</html>
